name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ['v*']

defaults:
  run:
    working-directory: spike

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spike/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Pendiente: validador de 10 000 sorteos y prueba de carga con 4 duelos simultáneos.

  # STUB: integrar en develop despliega al entorno de pruebas.
  deploy-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "TODO desplegar a pruebas (definir hosting y secretos)"

  # STUB: una etiqueta v* despliega a producción.
  deploy-production:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "TODO desplegar a producción (definir hosting y secretos)"
