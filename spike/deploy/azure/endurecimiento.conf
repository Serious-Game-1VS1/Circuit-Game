# Drop-in: /etc/systemd/system/arbitro.service.d/endurecimiento.conf  (S-05, 30-oct-2026)
# Sin MemoryDenyWriteExecute: Node (V8 JIT) lo necesita.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
# /opt/circuitsync: codigo, CSV (bench-out/), data/ y ~/.npm de npm; /var/lib/circuitsync: datos docente
ReadWritePaths=/opt/circuitsync /var/lib/circuitsync
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
UMask=0077
