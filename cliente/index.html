    <style>html, body { margin: 0; height: 100%; background: #1b1f2a; overflow: hidden; } canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }

  </head>

    <div id="girar" role="alert"><span style="font-size:40px">&#8635;</span><span>Gira el teléfono</span><span style="font-size:14px;color:#9ab0c8">CircuitSync se juega en vertical</span></div>
